<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#171717;color:#f4ead8;font-family:system-ui,sans-serif;overflow:hidden}
#wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px}
#top{width:min(100%,1000px);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#d8c7a8}
#game{width:min(100%,1000px);height:auto;aspect-ratio:1000/650;background:#211914;border:3px solid #62432e;border-radius:8px;image-rendering:pixelated;display:block;outline:none}
#bottom{width:min(100%,1000px);display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.panel{background:#2b211b;border:2px solid #60452f;border-radius:8px;padding:10px 12px;min-height:54px;flex:1}
#objectName{font-weight:800;color:#f6d69a;margin-bottom:3px}
#message{font-size:13px;color:#dfd0b8}
#hint{font-size:12px;color:#b8a58b}
button{background:#8a5b35;color:#fff1d5;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}
button:hover{background:#a87345}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><strong>MY PIXEL HOUSE</strong><span>이동: WASD / 방향키　 상호작용: 클릭 또는 E　 리셋: R</span></div>
  <canvas id="game" width="1000" height="650" tabindex="0"></canvas>
  <div id="bottom">
    <div class="panel" style="max-width:220px"><div id="objectName">집 탐험 중</div><div id="hint">물건을 클릭해 봐!</div></div>
    <div class="panel"><div id="message">초록색 러그 위에서 시작해. 집 안을 자유롭게 돌아다녀 봐.</div></div>
    <button id="reset">처음 위치로</button>
  </div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=1000,H=650;
const keys={};
let player={x:510,y:365,dir:0,step:0};
let selected=null, message="초록색 러그 위에서 시작해. 집 안을 자유롭게 돌아다녀 봐.";
let tick=0;
const objects=[
 {id:'fireplace',name:'벽난로',x:145,y:210,w:100,h:155,kind:'fire',desc:'벽난로의 불꽃이 따뜻하게 타오르고 있어.'},
 {id:'sink',name:'싱크대',x:330,y:245,w:125,h:65,kind:'sink',desc:'수도꼭지를 틀었어. 물소리가 졸졸 들려.'},
 {id:'stove',name:'가스레인지',x:470,y:245,w:75,h:105,kind:'stove',desc:'가스레인지야. 아직 요리할 음식은 없어.'},
 {id:'fridge',name:'냉장고',x:555,y:220,w:75,h:145,kind:'fridge',open:false,desc:'냉장고 문을 열었어. 안에는 우유와 채소가 있어.'},
 {id:'shelf',name:'책장',x:650,y:255,w:75,h:115,kind:'shelf',desc:'책들이 가지런히 꽂혀 있어.'},
 {id:'tv',name:'TV',x:145,y:485,w:80,h:65,kind:'tv',on:false,desc:'TV를 켰어. 화면에서 프로그램이 나오고 있어.'},
 {id:'sofa',name:'소파',x:155,y:525,w:115,h:95,kind:'sofa',desc:'푹신한 소파야. 잠시 앉아 쉬어도 좋겠어.'},
 {id:'table',name:'거실 테이블',x:300,y:530,w:115,h:75,kind:'table',desc:'테이블 위에 작은 화분과 책이 놓여 있어.'},
 {id:'wardrobe',name:'옷장',x:690,y:470,w:105,h:140,kind:'wardrobe',desc:'옷장 문을 열어 봤어. 옷들이 걸려 있어.'},
 {id:'bed',name:'침대',x:855,y:485,w:125,h:165,kind:'bed',desc:'침대야. 포근한 이불이 깔려 있어.'},
 {id:'lamp',name:'침대 옆 조명',x:940,y:590,w:40,h:55,kind:'lamp',on:false,desc:'침대 옆 조명을 켰어.'},
 {id:'plant',name:'화분',x:805,y:555,w:45,h:65,kind:'plant',desc:'초록 잎이 풍성한 실내 식물이야.'},
 {id:'bath',name:'세면대',x:850,y:175,w:65,h:65,kind:'bath',desc:'세면대야. 물을 틀어 손을 씻었어.'},
 {id:'toilet',name:'변기',x:925,y:245,w:55,h:75,kind:'toilet',desc:'화장실 변기야.'}
];
const solids=[
 [75,75,850,24],[75,75,24,500],[925,75,24,500],[75,575,850,24],
 [115,165,85,175],[300,225,165,95],[460,225,90,145],[550,190,85,190],
 [640,225,95,150],[125,455,150,170],[675,445,130,170],[835,455,145,190],
 [820,90,145,300]
];
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function poly(points,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fill()}
function outline(x,y,w,h,c='#24170f',lw=4){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h)}
function tileFloor(){
 rect(0,0,W,H,'#171311');
 // warm timber floor, with perspective-like plank lines
 poly([[75,95],[925,95],[925,575],[75,575]],'#98633a');
 for(let y=105;y<575;y+=28){
   rect(78,y,844,2,'#6e4328');
   for(let x=85+(Math.floor(y/28)%2)*48;x<920;x+=96) rect(x,y+2,2,24,'#81512f');
   for(let x=78;x<920;x+=8) { if((x+y)%7===0) rect(x,y+8,2,2,'#a87548'); }
 }
 // room divisions and tile bathroom
 poly([[815,95],[925,95],[925,390],[815,390]],'#41617b');
 for(let y=100;y<390;y+=32)for(let x=820;x<925;x+=32){outline(x,y,32,32,'#29465d',2);rect(x+3,y+3,26,26,'#527493')}
 // walls, dark wood framing
 rect(70,65,860,28,'#59351f');rect(70,65,28,520,'#59351f');rect(902,65,28,520,'#59351f');
 rect(70,565,860,28,'#59351f');
 rect(70,65,860,8,'#a36b3d');rect(70,65,8,520,'#a36b3d');rect(922,65,8,520,'#a36b3d');
 // top wall inner edge
 rect(98,92,804,8,'#392419');
 // bathroom wall
 rect(800,90,20,310,'#603b24');rect(800,90,130,18,'#603b24');rect(800,382,130,18,'#603b24');
 // doorway opening
 rect(800,395,20,52,'#603b24');
 // entrance at bottom
 rect(470,565,65,28,'#3b2518');rect(470,593,65,15,'#70472b');
 // rug
 rect(425,350,250,170,'#536c3e');outline(425,350,250,170,'#293d27',5);
 for(let x=440;x<665;x+=18){rect(x,360,5,4,'#a8a05d');rect(x,505,5,4,'#a8a05d')}
 for(let y=365;y<510;y+=18){rect(435,y,4,5,'#a8a05d');rect(660,y,4,5,'#a8a05d')}
 // dining rug
 rect(205,410,190,160,'#8a392c');outline(205,410,190,160,'#55251f',5);
}
function drawWindow(x,y){
 rect(x,y,72,55,'#6c3b1d');outline(x,y,72,55,'#2c1b12',4);
 rect(x+7,y+7,58,41,'#5d9bc0');rect(x+33,y+7,5,41,'#75431f');rect(x+7,y+25,58,4,'#75431f');
 rect(x-5,y-3,82,7,'#9c6335');
}
function plant(x,y,s=1){
 rect(x-10*s,y+15*s,22*s,18*s,'#98552c');rect(x-8*s,y+13*s,18*s,4*s,'#c27b40');
 [[-12,-5],[-3,-15],[8,-12],[14,-2],[0,-3],[-8,-20]].forEach((p,i)=>{rect(x+p[0]*s,y+p[1]*s,10*s,9*s,['#286a32','#388b3b','#1e572d'][i%3]);rect(x+(p[0]+2)*s,y+(p[1]+2)*s,4*s,3*s,'#65a84b')});
}
function drawFurniture(o){
 const x=o.x,y=o.y,w=o.w,h=o.h,k=o.kind;
 ctx.save();
 if(k==='fire'){
  rect(x,y,w,h,'#555052');outline(x,y,w,h,'#29252a',5);
  for(let i=0;i<5;i++)rect(x+8+i*17,y+8,12,8,'#777176');
  rect(x+18,y+75,64,67,'#211b1a');rect(x+25,y+85,50,50,'#542b19');
  rect(x+39,y+102,12,30,'#ff8b20');rect(x+50,y+91,13,42,'#ffb52e');rect(x+31,y+115,13,20,'#e64e16');
  rect(x+10,y+145,80,8,'#393438');
 } else if(k==='sink'){
  rect(x,y,w,h,'#80502b');outline(x,y,w,h,'#3b2518',4);rect(x+10,y+10,w-20,h-20,'#a56a37');
  rect(x+38,y+18,52,32,'#777e83');outline(x+38,y+18,52,32,'#353638',3);rect(x+44,y+23,40,21,'#b9c4c7');
  rect(x+62,y+7,7,15,'#aeb8bc');rect(x+58,y+5,18,5,'#d4dadd');
 } else if(k==='stove'){
  rect(x,y,w,h,'#66666a');outline(x,y,w,h,'#2b292b',4);rect(x+7,y+8,w-14,65,'#343438');
  for(let yy=20;yy<65;yy+=34)for(let xx=18;xx<65;xx+=34){ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x+xx,y+yy,9,0,Math.PI*2);ctx.stroke()}
  rect(x+8,y+82,w-16,15,'#242426');
 } else if(k==='fridge'){
  rect(x,y,w,h,'#aeb3b8');outline(x,y,w,h,'#3a3c40',4);rect(x+4,y+5,w-8,h/2-7,'#c8cdd0');rect(x+4,y+h/2+2,w-8,h/2-8,'#b5bbc0');rect(x+9,y+h/2-2,4,20,'#555a60');rect(x+9,y+15,4,23,'#555a60');
  if(o.open){rect(x+w+5,y+15,45,h-25,'#e5e8e7');rect(x+w+10,y+25,35,8,'#8bc1d5');rect(x+w+10,y+55,35,8,'#76a45c')}
 } else if(k==='shelf'){
  rect(x,y,w,h,'#17416a');outline(x,y,w,h,'#15283b',4);rect(x+5,y+8,w-10,8,'#3975a2');
  for(let yy=y+28;yy<y+h-8;yy+=35){rect(x+6,yy,w-12,4,'#9b693e');for(let i=0;i<3;i++)rect(x+10+i*17,yy-20,12,19,['#9c4d2f','#d0a34d','#55734a'][i])}
 } else if(k==='tv'){
  rect(x,y,w,h,'#704321');outline(x,y,w,h,'#291b12',4);rect(x+8,y+5,w-16,h-17,o.on?'#4c9ac4':'#111820');outline(x+8,y+5,w-16,h-17,'#171719',3);
  if(o.on){rect(x+17,y+14,20,15,'#8ed3dc');rect(x+39,y+14,22,15,'#345c87');rect(x+17,y+32,44,8,'#d5b06d')}
  rect(x+35,y+h-12,12,8,'#29211b');
 } else if(k==='sofa'){
  rect(x,y+12,w,h-15,'#21466e');outline(x,y+12,w,h-15,'#142b48',5);rect(x+8,y+20,25,h-32,'#35618a');rect(x+w-33,y+20,25,h-32,'#35618a');rect(x+35,y+18,w-70,h-28,'#47739a');rect(x+8,y+h-8,w-16,9,'#51351f');
 } else if(k==='table'){
  rect(x+8,y+20,w-16,h-20,'#754522');outline(x+8,y+20,w-16,h-20,'#3c2517',4);rect(x,y+8,w,18,'#a16a39');outline(x,y+8,w,18,'#432a19',3);plant(x+35,y+8,.55);rect(x+75,y+11,20,12,'#31577c');
 } else if(k==='wardrobe'){
  rect(x,y,w,h,'#754522');outline(x,y,w,h,'#382317',5);rect(x+8,y+8,w/2-10,h-16,'#87552d');rect(x+w/2+2,y+8,w/2-10,h-16,'#87552d');rect(x+w/2-4,y+65,5,12,'#e4b45a');rect(x+w/2+8,y+65,5,12,'#e4b45a');rect(x+12,y+14,w-24,4,'#a77543');
 } else if(k==='bed'){
  rect(x+8,y+8,w-16,h-16,'#694126');outline(x+8,y+8,w-16,h-16,'#321f16',5);rect(x+17,y+18,w-34,35,'#e4d9c9');rect(x+17,y+58,w-34,h-35,'#426e3e');rect(x+22,y+23,34,22,'#f4eee4');rect(x+62,y+23,34,22,'#f4eee4');rect(x+17,y+55,w-34,8,'#d5c6a9');
 } else if(k==='lamp'){
  rect(x+10,y+35,20,14,'#654125');rect(x+15,y+10,10,25,'#d4b36c');poly([[x+6,y+15],[x+20,y],[x+34,y+15]],o.on?'#ffe5a0':'#b9a276');if(o.on){ctx.globalAlpha=.18;ctx.fillStyle='#ffe28a';ctx.beginPath();ctx.arc(x+20,y+12,42,0,Math.PI*2);ctx.fill()}
 } else if(k==='plant'){plant(x+20,y+35,.9)}
 else if(k==='bath'){
  rect(x,y,w,h,'#aeb6bb');outline(x,y,w,h,'#46515a',4);rect(x+10,y+12,w-20,h-24,'#e1e6e7');ctx.strokeStyle='#7c898e';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x+33,y+30,13,0,Math.PI*2);ctx.stroke();
 } else if(k==='toilet'){
  rect(x+8,y,w-16,20,'#e3e6e4');rect(x+3,y+15,w-6,45,'#d6dddc');outline(x+3,y+15,w-6,45,'#667176',3);rect(x+13,y+24,w-26,25,'#aebabc');
 }
 ctx.restore();
}
function drawDining(){
 // dining table and chairs
 [[205,465],[350,465],[205,550],[350,550]].forEach(([x,y])=>{rect(x,y,38,34,'#704322');outline(x,y,38,34,'#3c2618',4);rect(x+5,y+5,28,24,'#956137')});
 rect(230,475,135,85,'#80502d');outline(230,475,135,85,'#3a2518',5);rect(238,482,119,70,'#38618a');for(let i=0;i<4;i++)rect(242+i*29,487,3,60,'#6e9ac0');plant(295,510,.8);
}
function drawBathroom(){
 // small window
 drawWindow(842,120);
 // sink and toilet sprites
 drawFurniture(objects.find(o=>o.kind==='bath'));drawFurniture(objects.find(o=>o.kind==='toilet'));
 rect(835,320,75,40,'#254c78');outline(835,320,75,40,'#1c3147',3);
}
function drawWindowsAndDecor(){
 drawWindow(270,125);drawWindow(690,120);
 plant(300,260,1);plant(590,155,1.1);plant(850,105,.8);plant(120,565,1.3);
 // wall picture
 rect(745,125,48,42,'#704323');outline(745,125,48,42,'#332015',3);rect(751,131,36,30,'#7eb0bd');poly([[752,157],[767,140],[778,151],[787,137],[787,160]],'#477447');
 // hanging utensils
 for(let i=0;i<3;i++){rect(390+i*27,195,5,35,'#4b4b4a');rect(383+i*27,222,18,7,'#7a7d7d')}
}
function drawPlayer(){
 const x=player.x,y=player.y, moving=keys['a']||keys['d']||keys['w']||keys['s']||keys['ArrowLeft']||keys['ArrowRight']||keys['ArrowUp']||keys['ArrowDown'];
 const bob=moving?Math.sin(tick*.25)*2:0;
 // shadow
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y+18,18,7,0,0,Math.PI*2);ctx.fill();
 // feet
 rect(x-11,y+7+bob,9,12,'#343b43');rect(x+3,y+7-bob,9,12,'#343b43');
 // body
 rect(x-15,y-13,30,27,'#315d9a');rect(x-18,y-10,7,18,'#e1a18b');rect(x+11,y-10,7,18,'#e1a18b');
 rect(x-10,y-28,20,18,'#e7a88e');rect(x-12,y-34,24,10,'#593522');rect(x-15,y-29,6,12,'#593522');rect(x+9,y-31,6,10,'#593522');
 rect(x-6,y-23,3,4,'#29201d');rect(x+4,y-23,3,4,'#29201d');
}
function draw(){
 tick++;
 tileFloor();
 drawWindowsAndDecor();
 // kitchen counter cabinet
 rect(285,260,275,42,'#704321');outline(285,260,275,42,'#3d2618',4);
 for(let x=295;x<555;x+=65){rect(x,305,58,65,'#80502e');outline(x,305,58,65,'#42291a',3);rect(x+25,330,8,5,'#d1a15d')}
 // counter back shelf and pot
 rect(445,145,110,48,'#754624');outline(445,145,110,48,'#3e2819',3);plant(465,140,.8);
 rect(535,125,34,50,'#55575b');outline(535,125,34,50,'#27292d',3);rect(542,120,20,8,'#777b80');
 // main objects, except bathroom
 objects.filter(o=>!['bath','toilet'].includes(o.kind)).forEach(drawFurniture);
 drawDining();
 // bedroom nightstand
 rect(930,590,45,45,'#754522');outline(930,590,45,45,'#3d2518',3);drawFurniture(objects.find(o=>o.kind==='lamp'));
 // bathroom door
 rect(800,390,80,15,'#684126');rect(800,390,10,55,'#684126');rect(815,405,55,35,'#704526');
 drawBathroom();
 // entrance flower pots
 plant(445,585,1.1);plant(560,585,1.1);
 // player on top of room
 drawPlayer();
 // selected highlight
 if(selected){ctx.strokeStyle='#ffe28a';ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.strokeRect(selected.x-3,selected.y-3,selected.w+6,selected.h+6);ctx.setLineDash([])}
 // interaction prompt
 const near=nearestObject();
 if(near){ctx.fillStyle='rgba(28,22,17,.88)';ctx.fillRect(player.x-48,player.y-65,96,22);ctx.fillStyle='#ffe3a6';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('E : '+near.name,player.x,player.y-50)}
 requestAnimationFrame(draw);
}
function nearestObject(){
 let best=null,bd=75;
 for(const o of objects){const cx=o.x+o.w/2,cy=o.y+o.h/2;const d=Math.hypot(player.x-cx,player.y-cy);if(d<bd){best=o;bd=d}}
 return best;
}
function interact(o){
 if(!o)return;
 selected=o;
 if(o.kind==='tv'){o.on=!o.on;message=o.on?'TV를 켰어. 화면에 영상이 나오고 있어.':'TV를 껐어.'}
 else if(o.kind==='fridge'){o.open=!o.open;message=o.open?'냉장고 문을 열었어. 안에 음식이 보여.':'냉장고 문을 닫았어.'}
 else if(o.kind==='lamp'){o.on=!o.on;message=o.on?'조명을 켰어. 주변이 따뜻하게 밝아졌어.':'조명을 껐어.'}
 else message=o.desc;
 document.getElementById('objectName').textContent=o.name;
 document.getElementById('hint').textContent='상호작용 완료';
 document.getElementById('message').textContent=message;
}
function move(){
 const speed=2.4;
 let dx=0,dy=0;
 if(keys['a']||keys['ArrowLeft'])dx--;
 if(keys['d']||keys['ArrowRight'])dx++;
 if(keys['w']||keys['ArrowUp'])dy--;
 if(keys['s']||keys['ArrowDown'])dy++;
 if(dx&&dy){dx*=.707;dy*=.707}
 let nx=player.x+dx*speed,ny=player.y+dy*speed;
 // keep inside walkable room; bathroom is a separate upper-right area
 nx=Math.max(110,Math.min(890,nx));ny=Math.max(125,Math.min(555,ny));
 // simple furniture collision: don't let player enter object rectangles
 for(const o of objects){
   const pad=17, bx=o.x-pad,by=o.y-pad,bw=o.w+pad*2,bh=o.h+pad*2;
   if(nx>bx&&nx<bx+bw&&ny>by&&ny<by+bh){
     if(!(player.x>bx&&player.x<bx+bw))nx=player.x;
     if(!(player.y>by&&player.y<by+bh))ny=player.y;
   }
 }
 // collision with kitchen cabinets and dining table
 const blocks=[[285,260,275,110],[220,470,155,95],[800,90,20,300]];
 for(const b of blocks){if(nx>b[0]-15&&nx<b[0]+b[2]+15&&ny>b[1]-15&&ny<b[1]+b[3]+15){nx=player.x;ny=player.y}}
 player.x=nx;player.y=ny;
}
window.addEventListener('keydown',e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 keys[k]=true;
 if(k==='e')interact(nearestObject());
 if(k==='r'){player.x=510;player.y=365;selected=null;message='처음 위치로 돌아왔어.';document.getElementById('message').textContent=message}
});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
canvas.addEventListener('click',e=>{
 const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;
 const x=(e.clientX-r.left)*sx,y=(e.clientY-r.top)*sy;
 let hit=null;
 for(const o of [...objects].reverse()){if(x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h){hit=o;break}}
 if(hit)interact(hit);else{canvas.focus();selected=null}
});
document.getElementById('reset').addEventListener('click',()=>{player.x=510;player.y=365;selected=null;document.getElementById('message').textContent='처음 위치로 돌아왔어.'});
function loop(){move();requestAnimationFrame(loop)}
canvas.focus();loop();draw();
})();
